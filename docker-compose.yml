services:
  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: friday-telegram
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=America/Sao_Paulo
      - VAULT_PATH=/vault
      - PATHS_ROOT=/app
      - PATHS_DATA=/app/data
      - PATHS_LOGS=/app/logs
      - HF_HOME=/app/data/.cache/huggingface
      - TRANSFORMERS_CACHE=/app/data/.cache/huggingface
    user: "1000:1000"
    group_add:
      - "996"  # docker group for socket access
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ${VAULT_PATH}:/vault
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: python -m src.interfaces.telegram.run
    networks:
      - exposed

  awareness-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: friday-awareness
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=America/Sao_Paulo
      - VAULT_PATH=/vault
      - PATHS_ROOT=/app
      - PATHS_DATA=/app/data
      - PATHS_LOGS=/app/logs
      - HF_HOME=/app/data/.cache/huggingface
      - TRANSFORMERS_CACHE=/app/data/.cache/huggingface
    user: "1000:1000"
    group_add:
      - "996"  # docker group for socket access
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ${VAULT_PATH}:/vault
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: python -m src.awareness.engine
    networks:
      - exposed

networks:
  exposed:
    external: true
